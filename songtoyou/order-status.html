<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>주문 조회 | SongToYou</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"/><link rel="stylesheet" href="./styles.css"/><link rel="stylesheet" href="./styles-v4.css"/></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="./index.html"><span class="brand-symbol">♫</span><span>SongToYou<span class="brand-period">.</span></span></a><a class="doc-back" href="./index.html">← 홈으로</a></div></header><main class="container"><div class="doc-wrap"><h1>주문 조회</h1><p class="upd">시연 화면 · 이 브라우저에 저장된 시연 주문만 표시돼요</p>
<div class="draft">실제 서비스에서는 주문번호와 연락처로 본인 확인 후 제작 상태·선물 링크를 확인할 수 있어요.</div>
<div id="orders"></div>
<script>
(function(){var box=document.getElementById('orders'),list=[];try{list=JSON.parse(localStorage.getItem('songtoyou-demo-orders')||'[]')}catch(e){}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
box.innerHTML=list.length?list.map(function(o){return '<div class="status-card"><b>'+esc(o.id)+' · '+esc(o.recipient)+'님께 전하는 '+esc(o.occasion)+' 노래</b><small>'+esc(o.status)+' · ₩'+Number(o.total).toLocaleString('ko-KR')+'</small></div>'}).join(''):'<p>아직 시연 주문이 없어요. <a class="doc-back" href="./index.html">무료로 만들어 보기 →</a></p>';})();
</script>
